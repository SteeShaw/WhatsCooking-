<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsCooking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ebe8e1; --card:#f3f1ec; --ink:#1c1b19; --muted:#7c776d; --rule:#cfcac0;
  --hi:rgba(255,255,255,.85); --lo:rgba(60,50,35,.22);
  --accent:#2347ff; --accent-ink:#fff;
  --p:#e86a4a; --c:#4f8fd6; --f:#d9a441;
  --noise-op:.35;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#181715; --card:#201f1c; --ink:#efece5; --muted:#9b958a; --rule:#37342f;
    --hi:rgba(255,255,255,.07); --lo:rgba(0,0,0,.75);
    --accent:#5b78ff; --noise-op:.18;
  }
}
:root[data-theme="dark"]{
  --paper:#181715; --card:#201f1c; --ink:#efece5; --muted:#9b958a; --rule:#37342f;
  --hi:rgba(255,255,255,.07); --lo:rgba(0,0,0,.75);
  --accent:#5b78ff; --noise-op:.18;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Inter Tight",system-ui,sans-serif;position:relative;min-height:100vh}
/* paper grain */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--noise-op);z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:28px 16px 72px}
.display{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:.92}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}

/* Embossed wordmark: same colour as the paper, lit from top-left */
.emboss{color:var(--paper);text-shadow:-1px -1px 1px var(--hi),1px 1px 1px var(--lo),2px 2px 3px var(--lo)}

/* ---------- Masthead ---------- */
.mast{border-bottom:1px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
.mast .top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:6px}
.wordmark{font-size:clamp(44px,15.2vw,186px);margin:0;letter-spacing:.015em;white-space:nowrap;overflow:hidden}
.mast .bottom{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-top:8px}
.tagline{font-size:15px;max-width:420px}

button{font:inherit;cursor:pointer;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:0;padding:8px 14px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
button:hover{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.3;pointer-events:none}
.primary{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:20px;letter-spacing:.04em;padding:12px 22px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---------- Spec strip (settings) ---------- */
.spec{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--ink);margin-bottom:24px;background:var(--card)}
.spec label{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-right:1px solid var(--rule)}
.spec label:nth-child(6){border-right:0}
.spec input{font-family:Anton,Impact,sans-serif;font-size:26px;line-height:1.1;color:var(--ink);background:transparent;border:0;padding:0;width:100%;outline:none}
.spec input:focus{color:var(--accent)}
.spec .target{grid-column:1/-1;border-top:1px solid var(--ink);padding:8px 12px;display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px}
.spec .target b{font-weight:600}
@media (max-width:720px){.spec{grid-template-columns:repeat(3,1fr)}.spec label:nth-child(3){border-right:0}.spec label:nth-child(-n+3){border-bottom:1px solid var(--rule)}}

.layout{display:grid;grid-template-columns:1.55fr 1fr;gap:24px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}

/* ---------- Day cards ---------- */
.days{display:flex;flex-direction:column;gap:14px}
.day{display:grid;grid-template-columns:1fr 170px;background:var(--card);border:1px solid var(--ink);min-height:180px}
.day.locked{outline:2px solid var(--accent);outline-offset:2px}
.info{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dayrow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:8px}
.dayname{color:var(--ink);white-space:nowrap}
.actions{display:flex;gap:6px}
.actions button{padding:5px 9px;font-size:10px}
.recipe{font-size:clamp(24px,3.2vw,32px);margin:2px 0 0;cursor:pointer}
.recipe:hover{color:var(--accent)}
.bars{display:grid;grid-template-columns:16px 1fr 64px;gap:5px 10px;align-items:center;font-size:12px;margin-top:auto}
.bars span:first-child,.bars span:nth-child(3n+1){font-weight:600}
.bars .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--rule);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0}
.bar b{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink);left:100%}

/* boxed gradient panel */
.swatch{position:relative;overflow:hidden;border-left:1px solid var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:12px;isolation:isolate}
.swatch::before{content:"";position:absolute;inset:-30%;z-index:-1;filter:blur(18px);background:var(--g)}
.swatch .kc{font-family:Anton,Impact,sans-serif;font-size:64px;line-height:.9;text-transform:uppercase;color:rgba(255,255,255,.28);
  text-shadow:-1px -1px 1px rgba(255,255,255,.55),1px 1px 1px rgba(0,0,0,.18);letter-spacing:.01em}
.swatch .unit,.swatch .tag{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(0,0,0,.55);mix-blend-mode:multiply}
.swatch .tag{align-self:flex-end;writing-mode:vertical-rl;transform:rotate(180deg)}
.swatch .bottomrow{display:flex;justify-content:space-between;align-items:end}
.swatch .portion{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.55);color:#1c1b19;padding:2px 6px}
@media (max-width:520px){.day{grid-template-columns:1fr 112px}.swatch .kc{font-size:44px}}

.g0{--g:radial-gradient(60% 55% at 30% 25%,#ffd27a,transparent 70%),radial-gradient(70% 60% at 80% 80%,#ff8f70,transparent 70%),radial-gradient(80% 80% at 10% 90%,#8fb7ff,transparent 70%),#f4b28c}
.g1{--g:radial-gradient(60% 55% at 70% 20%,#9fe3d6,transparent 70%),radial-gradient(70% 60% at 20% 75%,#ffb7c6,transparent 70%),radial-gradient(60% 60% at 90% 90%,#f8e7a6,transparent 70%),#c9e2dc}
.g2{--g:radial-gradient(55% 55% at 65% 70%,#ff9a7a,transparent 70%),radial-gradient(70% 60% at 25% 20%,#5d77d8,transparent 70%),radial-gradient(60% 60% at 90% 10%,#c3b4f0,transparent 70%),#8e93d8}
.g3{--g:radial-gradient(60% 55% at 40% 60%,#d9f2ff,transparent 70%),radial-gradient(70% 60% at 80% 20%,#58b8c9,transparent 70%),radial-gradient(60% 60% at 15% 15%,#3f6fd1,transparent 70%),#79b2d6}
.g4{--g:radial-gradient(55% 55% at 50% 55%,#ff7a3d,transparent 70%),radial-gradient(70% 60% at 20% 20%,#6a1f25,transparent 70%),radial-gradient(60% 60% at 85% 85%,#2a1a33,transparent 70%),#5a2a2a}
.g4 .unit,.g4 .tag{color:rgba(255,255,255,.6);mix-blend-mode:normal}
.g4 .kc{color:rgba(255,255,255,.14);text-shadow:-1px -1px 1px rgba(255,255,255,.3),1px 1px 1px rgba(0,0,0,.45)}

.detail{display:none;font-size:14px;border-top:1px solid var(--rule);padding-top:8px}
.day.open .detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.day.open .detail{grid-template-columns:1fr}}
.detail ul,.detail ol{margin:4px 0 0;padding-left:18px}
.detail li{margin:2px 0}

/* ---------- Side panel ---------- */
aside{position:sticky;top:16px;background:var(--card);border:1px solid var(--ink)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--ink)}
.stat{padding:10px 10px 8px;border-right:1px solid var(--rule)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:28px;line-height:1}
.stat .delta{font-size:11px;color:var(--muted)}
.stat.off b{color:var(--p)}
.shop{padding:14px 16px 16px}
.shophead{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:8px}
.shophead h2{font-size:34px;margin:0}
.shop h3{margin:16px 0 4px}
.shop label{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.shop input{accent-color:var(--accent);transform:translateY(1px)}
.shop .qty{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.shop label.done span{text-decoration:line-through;color:var(--muted)}
.staples{font-size:13px;color:var(--muted)}

.foot{margin-top:28px;border-top:1px solid var(--ink);padding-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="top"><span class="label">Weekly dinner planner</span><span class="label" id="weekno"></span></div>
    <h1 class="wordmark display emboss">WhatsCooking</h1>
    <div class="bottom">
      <div class="tagline">Five dinners that fit your macros, and the shopping list to match.</div>
      <button class="primary" id="gen">Pick my week</button>
    </div>
  </header>

  <section class="spec" id="settings">
    <label><span class="label">Daily kcal</span><input type="number" id="kcal" step="50" inputmode="numeric"></label>
    <label><span class="label">Protein g</span><input type="number" id="protein" step="5" inputmode="numeric"></label>
    <label><span class="label">Carbs g</span><input type="number" id="carbs" step="5" inputmode="numeric"></label>
    <label><span class="label">Fat g</span><input type="number" id="fat" step="5" inputmode="numeric"></label>
    <label><span class="label">Dinner %</span><input type="number" id="share" step="5" min="10" max="70" inputmode="numeric"></label>
    <label><span class="label">People</span><input type="number" id="people" step="1" min="1" max="8" inputmode="numeric"></label>
    <div class="target" id="targetline"></div>
  </section>

  <div class="layout">
    <div class="days" id="days"></div>
    <aside>
      <div class="summary" id="summary"></div>
      <div class="shop">
        <div class="shophead"><h2 class="display">Shopping list</h2><button id="copy">Copy</button></div>
        <div id="shop"></div>
      </div>
    </aside>
  </div>

  <div class="foot"><span class="label">Macros are approximate</span><span class="label">Tap a dinner for the recipe</span></div>
</div>
<div class="toast" id="toast"></div>

<script>
const A = {M:'Meat & fish', V:'Fruit & veg', D:'Dairy & eggs', C:'Cupboard', S:'Staples'};
const R = [
 {id:'fajita',name:'Chicken fajita rice bowls',tag:'chicken',kcal:640,p:58,c:72,f:10,
  i:[['Chicken breast',200,'g','M'],['Basmati rice',75,'g','C'],['Peppers',1,'','V'],['Red onion',0.5,'','V'],['Greek yogurt (0%)',50,'g','D'],['Lime',0.5,'','V'],['Fajita seasoning',1,'tbsp','S']],
  m:['Slice chicken, peppers and onion; toss with seasoning.','Cook rice. Fry chicken and veg in a hot pan for 8–10 min.','Serve over rice with yogurt and a squeeze of lime.']},
 {id:'chilli',name:'Beef chilli & rice',tag:'beef',kcal:720,p:52,c:85,f:15,
  i:[['Lean beef mince (5%)',175,'g','M'],['Kidney beans',0.5,'tin','C'],['Chopped tomatoes',0.5,'tin','C'],['Onion',0.5,'','V'],['Basmati rice',75,'g','C'],['Chilli powder',1,'tsp','S'],['Garlic',1,'clove','V']],
  m:['Brown mince with onion and garlic.','Add chilli powder, tomatoes and beans; simmer 20 min.','Serve with rice.']},
 {id:'salmon',name:'Lemon salmon, new potatoes & greens',tag:'fish',kcal:620,p:36,c:50,f:28,
  i:[['Salmon fillet',1,'','M'],['New potatoes',250,'g','V'],['Tenderstem broccoli',100,'g','V'],['Lemon',0.5,'','V'],['Olive oil',1,'tsp','S']],
  m:['Boil potatoes 15 min.','Roast salmon at 200°C for 12–14 min with lemon.','Steam broccoli and serve together.']},
 {id:'meatball',name:'Turkey meatball pasta',tag:'turkey',kcal:720,p:58,c:82,f:15,
  i:[['Turkey mince',175,'g','M'],['Pasta',90,'g','C'],['Passata',200,'g','C'],['Garlic',2,'clove','V'],['Parmesan',15,'g','D'],['Dried oregano',1,'tsp','S']],
  m:['Roll seasoned mince into meatballs and brown.','Add passata, garlic and oregano; simmer 15 min.','Toss with cooked pasta and top with parmesan.']},
 {id:'tikka',name:'Chicken tikka & spinach rice',tag:'chicken',kcal:660,p:60,c:70,f:12,
  i:[['Chicken breast',200,'g','M'],['Greek yogurt (0%)',60,'g','D'],['Tikka paste',1,'tbsp','C'],['Basmati rice',75,'g','C'],['Spinach',50,'g','V'],['Onion',0.5,'','V']],
  m:['Marinate chicken in yogurt and tikka paste.','Grill or air-fry 15 min. Fry onion, wilt spinach.','Stir spinach through rice and serve with chicken.']},
 {id:'prawn',name:'Garlic prawn stir-fry noodles',tag:'fish',kcal:600,p:45,c:72,f:12,
  i:[['King prawns',200,'g','M'],['Egg noodles',75,'g','C'],['Stir-fry veg',150,'g','V'],['Soy sauce',1,'tbsp','S'],['Sesame oil',1,'tsp','S'],['Garlic',2,'clove','V'],['Ginger',1,'tsp','V']],
  m:['Cook noodles and drain.','Stir-fry garlic, ginger and veg 3 min, add prawns 3 min.','Toss in noodles, soy and sesame oil.']},
 {id:'steak',name:'Steak & sweet potato wedges',tag:'beef',kcal:730,p:56,c:62,f:26,
  i:[['Sirloin steak',225,'g','M'],['Sweet potato',300,'g','V'],['Salad leaves',50,'g','V'],['Olive oil',1,'tsp','S'],['Smoked paprika',1,'tsp','S']],
  m:['Cut wedges, toss with oil and paprika, roast at 200°C for 30 min.','Sear steak to your liking, rest 5 min.','Slice and serve with wedges and leaves.']},
 {id:'cod',name:'Cod & chorizo traybake',tag:'fish',kcal:580,p:48,c:50,f:16,
  i:[['Cod fillet',200,'g','M'],['Chorizo',30,'g','M'],['New potatoes',250,'g','V'],['Cherry tomatoes',100,'g','V'],['Olive oil',1,'tsp','S']],
  m:['Roast halved potatoes and chorizo at 200°C for 20 min.','Add tomatoes and cod, roast 12 min more.','Spoon the chorizo oil over the fish to serve.']},
 {id:'paella',name:'Chicken & chorizo rice',tag:'chicken',kcal:720,p:50,c:78,f:20,
  i:[['Chicken thighs (skinless)',180,'g','M'],['Chorizo',30,'g','M'],['Paella or risotto rice',75,'g','C'],['Frozen peas',60,'g','C'],['Peppers',1,'','V'],['Chicken stock cube',0.5,'','C'],['Smoked paprika',1,'tsp','S']],
  m:['Brown chicken and chorizo, add pepper.','Stir in rice, paprika and 250ml stock per portion.','Simmer 18 min, add peas for the last 3.']},
 {id:'pork',name:'Honey soy pork & rice',tag:'pork',kcal:650,p:55,c:75,f:10,
  i:[['Pork tenderloin',200,'g','M'],['Basmati rice',75,'g','C'],['Pak choi',1,'','V'],['Soy sauce',1,'tbsp','S'],['Honey',1,'tsp','C'],['Garlic',1,'clove','V']],
  m:['Slice pork thinly; mix soy, honey and garlic.','Stir-fry pork 5 min, add pak choi and sauce.','Serve over rice.']},
 {id:'dal',name:'Red lentil & chickpea dal',tag:'veg',kcal:650,p:32,c:92,f:14,
  i:[['Red lentils',80,'g','C'],['Chickpeas',0.5,'tin','C'],['Light coconut milk',100,'ml','C'],['Spinach',50,'g','V'],['Onion',0.5,'','V'],['Basmati rice',50,'g','C'],['Curry powder',1,'tbsp','S']],
  m:['Fry onion with curry powder.','Add lentils, coconut milk and 250ml water; simmer 20 min.','Stir in chickpeas and spinach; serve with rice.']},
 {id:'greek',name:'Greek chicken traybake',tag:'chicken',kcal:650,p:60,c:52,f:18,
  i:[['Chicken breast',200,'g','M'],['New potatoes',250,'g','V'],['Red onion',0.5,'','V'],['Cherry tomatoes',100,'g','V'],['Feta',30,'g','D'],['Olive oil',1,'tsp','S'],['Dried oregano',1,'tsp','S']],
  m:['Toss potatoes, onion and oil; roast at 200°C for 15 min.','Add chicken, tomatoes and oregano; roast 20 min.','Crumble feta over to serve.']},
 {id:'burrito',name:'Turkey burrito bowl',tag:'turkey',kcal:720,p:58,c:90,f:10,
  i:[['Turkey mince',175,'g','M'],['Basmati rice',75,'g','C'],['Black beans',0.5,'tin','C'],['Sweetcorn',50,'g','C'],['Salsa',50,'g','C'],['Greek yogurt (0%)',40,'g','D'],['Fajita seasoning',1,'tbsp','S']],
  m:['Brown mince with seasoning.','Warm beans and sweetcorn.','Build bowls with rice, mince, beans, salsa and yogurt.']},
 {id:'tuna',name:'Tuna sweetcorn pasta bake',tag:'fish',kcal:700,p:55,c:80,f:14,
  i:[['Tinned tuna',1.5,'tin','C'],['Pasta',90,'g','C'],['Sweetcorn',50,'g','C'],['Passata',150,'g','C'],['Lighter cheddar',25,'g','D']],
  m:['Cook pasta until just underdone.','Mix with tuna, sweetcorn and passata in a dish.','Top with cheese; bake at 200°C for 15 min.']},
 {id:'teriyaki',name:'Teriyaki salmon & edamame rice',tag:'fish',kcal:690,p:45,c:72,f:22,
  i:[['Salmon fillet',1,'','M'],['Basmati rice',75,'g','C'],['Edamame beans',60,'g','C'],['Teriyaki sauce',1,'tbsp','S'],['Spring onions',2,'','V']],
  m:['Brush salmon with teriyaki; bake at 200°C for 12 min.','Cook rice, add edamame for the last 3 min.','Serve with sliced spring onions.']},
 {id:'beefbroc',name:'Beef & broccoli',tag:'beef',kcal:680,p:55,c:72,f:16,
  i:[['Lean beef strips',200,'g','M'],['Broccoli',150,'g','V'],['Basmati rice',75,'g','C'],['Oyster sauce',1,'tbsp','S'],['Soy sauce',1,'tbsp','S'],['Garlic',1,'clove','V']],
  m:['Sear beef strips in a very hot pan; set aside.','Stir-fry broccoli and garlic 4 min.','Return beef, add sauces, serve over rice.']},
 {id:'pesto',name:'Chicken pesto pasta',tag:'chicken',kcal:720,p:56,c:70,f:22,
  i:[['Chicken breast',175,'g','M'],['Pasta',90,'g','C'],['Green pesto',15,'g','C'],['Cherry tomatoes',100,'g','V'],['Spinach',40,'g','V']],
  m:['Cook pasta. Pan-fry sliced chicken 8 min.','Add tomatoes and spinach until wilted.','Stir through pasta and pesto.']},
 {id:'halloumi',name:'Halloumi, chickpea & veg couscous',tag:'veg',kcal:720,p:35,c:80,f:26,
  i:[['Halloumi (light)',80,'g','D'],['Couscous',75,'g','C'],['Chickpeas',0.5,'tin','C'],['Courgette',0.5,'','V'],['Peppers',1,'','V'],['Lemon',0.5,'','V']],
  m:['Roast chopped veg and chickpeas at 200°C for 20 min.','Make couscous with boiling water, fluff with lemon.','Fry halloumi slices and serve on top.']},
];
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];

// ---------- State ----------
const DEF = {kcal:2500,protein:160,carbs:260,fat:85,share:30,people:1};
let S = load() || {settings:{...DEF}, plan:[], locked:[], ticked:{}};
function load(){ try{ return JSON.parse(localStorage.getItem('wc')); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem('wc', JSON.stringify(S)); }catch(e){} }

const $ = id => document.getElementById(id);
const byId = id => R.find(r => r.id === id);

function targets(){
  const s = S.settings, k = s.share/100;
  return {kcal:s.kcal*k, p:s.protein*k, c:s.carbs*k, f:s.fat*k};
}
// Portion scale so each dinner hits the calorie target
function scaleFor(r){ const t = targets(); return Math.min(1.4, Math.max(0.75, t.kcal / r.kcal)); }
function scaled(r){ const s = scaleFor(r); return {kcal:r.kcal*s, p:r.p*s, c:r.c*s, f:r.f*s, s}; }

// How well a recipe fits once scaled to calories: protein matters most
function score(r){
  const t = targets(), m = scaled(r);
  const pShort = Math.max(0, t.p - m.p) / t.p;
  return pShort*3 + Math.abs(m.c - t.c)/t.c*0.6 + Math.abs(m.f - t.f)/t.f*0.6 + Math.abs(m.kcal - t.kcal)/t.kcal;
}
function pick(exclude, usedTags){
  let pool = R.filter(r => !exclude.includes(r.id));
  const fresh = pool.filter(r => (usedTags[r.tag]||0) < 2);
  if (fresh.length) pool = fresh;
  const w = pool.map(r => Math.exp(-score(r)*4));
  let x = Math.random() * w.reduce((a,b)=>a+b,0);
  for (let i=0;i<pool.length;i++){ x -= w[i]; if (x<=0) return pool[i].id; }
  return pool[pool.length-1].id;
}
function tagsOf(ids){ const t={}; ids.forEach(id=>{ if(id){ const g=byId(id).tag; t[g]=(t[g]||0)+1; } }); return t; }

function generate(){
  const plan = DAYS.map((_,i) => S.locked[i] ? S.plan[i] : null);
  DAYS.forEach((_,i) => { if (!plan[i]) plan[i] = pick(plan.filter(Boolean), tagsOf(plan)); });
  S.plan = plan; S.ticked = {}; save(); render();
}
function swap(i){
  const others = S.plan.filter((_,j)=>j!==i);
  S.plan[i] = pick([...others, S.plan[i]], tagsOf(others));
  S.ticked = {}; save(); render();
}

// ---------- Quantities ----------
function fmt(q,u){
  if (u==='g' && q>=1000) return (q/1000).toFixed(2).replace(/\.?0+$/,'')+' kg';
  if (u==='g'||u==='ml') return Math.round(q/5)*5 + ' ' + u;
  if (u==='tin'){ const v=Math.ceil(q*2)/2; return v + (v===1?' tin':' tins'); }
  if (u==='clove'){ const v=Math.ceil(q); return v + (v===1?' clove':' cloves'); }
  if (u==='') return '× ' + Math.ceil(q);
  return '';
}
function portion(q,u,s){
  if (u==='tsp'||u==='tbsp') return q+' '+u;
  if (u==='g'||u==='ml') return Math.round(q*s/5)*5+' '+u;
  const v = Math.round(q*s*4)/4, nice = v%1===0 ? v : v.toFixed(2).replace(/0$/,'');
  return u==='' ? nice : nice+' '+u+(v>1?'s':'');
}
function shopping(){
  const n = S.settings.people, items = {};
  S.plan.forEach(id => {
    const r = byId(id); if(!r) return; const s = scaleFor(r);
    r.i.forEach(([name,q,u,a]) => {
      const key = name+'|'+u;
      const mult = (a==='S' || u==='tsp' || u==='tbsp') ? n : n*s;
      items[key] = items[key] || {name,u,a,q:0};
      items[key].q += q*mult;
    });
  });
  const groups = {};
  Object.values(items).forEach(it => { (groups[it.a] = groups[it.a] || []).push(it); });
  Object.values(groups).forEach(g => g.sort((a,b)=>a.name.localeCompare(b.name)));
  return groups;
}

// ---------- Render ----------
function bar(label, v, t, col){
  const pct = Math.min(125, v/t*100);
  return `<span>${label}</span><div class="bar"><i style="width:${pct*0.8}%;background:${col}"></i><b style="left:80%"></b></div><span class="val">${Math.round(v)} / ${Math.round(t)}g</span>`;
}
function render(){
  const s = S.settings, t = targets();
  ['kcal','protein','carbs','fat','share','people'].forEach(k => { if (document.activeElement !== $(k)) $(k).value = s[k]; });
  $('targetline').innerHTML = `<span class="label" style="color:var(--ink)">Per dinner</span><span><b>${Math.round(t.kcal)}</b> kcal</span><span><b>${Math.round(t.p)}g</b> protein</span><span><b>${Math.round(t.c)}g</b> carbs</span><span><b>${Math.round(t.f)}g</b> fat</span>`;

  $('days').innerHTML = S.plan.map((id,i) => {
    const r = byId(id), m = scaled(r), locked = S.locked[i];
    const ps = Math.abs(m.s-1)>0.04 ? `<span class="portion">${m.s.toFixed(2).replace(/0$/,'')}×</span>` : '<span></span>';
    return `<article class="day ${locked?'locked':''}" data-i="${i}">
      <div class="info">
        <div class="dayrow">
          <span class="label dayname">0${i+1} — ${DAYS[i]}</span>
          <div class="actions">
            <button data-act="lock" aria-pressed="${!!locked}">${locked?'Locked':'Lock'}</button>
            <button data-act="swap" ${locked?'disabled':''}>Swap</button>
          </div>
        </div>
        <h3 class="recipe display" data-act="open">${r.name}</h3>
        <div class="bars">${bar('P',m.p,t.p,'var(--p)')}${bar('C',m.c,t.c,'var(--c)')}${bar('F',m.f,t.f,'var(--f)')}</div>
        <div class="detail">
          <div><div class="label">Per portion${s.people>1?` · ×${s.people}`:''}</div>
            <ul>${r.i.map(([n,q,u]) => `<li>${n} — ${portion(q,u,m.s)}</li>`).join('')}</ul></div>
          <div><div class="label">Method</div><ol>${r.m.map(x=>`<li>${x}</li>`).join('')}</ol></div>
        </div>
      </div>
      <div class="swatch g${i}">
        <div><div class="kc">${DAYS[i].slice(0,3)}</div><div class="unit">${Math.round(m.kcal)} kcal · ${Math.round(m.p)}g protein</div></div>
        <div class="bottomrow">${ps}<span class="tag">${r.tag}</span></div>
      </div>
    </article>`;
  }).join('');

  const N = S.plan.length;
  const avg = S.plan.reduce((a,id)=>{ const m=scaled(byId(id)); a.kcal+=m.kcal;a.p+=m.p;a.c+=m.c;a.f+=m.f; return a; },{kcal:0,p:0,c:0,f:0});
  const stat = (lab,v,tt,unit) => {
    const d = Math.round(v - tt), off = Math.abs(v/tt-1) > 0.12;
    return `<div class="stat ${off?'off':''}"><span class="label">${lab}</span><b>${Math.round(v)}${unit}</b><span class="delta">${d>=0?'+':''}${d}${unit} vs target</span></div>`;
  };
  $('summary').innerHTML = stat('Avg kcal',avg.kcal/N,t.kcal,'') + stat('Protein',avg.p/N,t.p,'g') + stat('Carbs',avg.c/N,t.c,'g') + stat('Fat',avg.f/N,t.f,'g');

  const g = shopping();
  let html = ['M','V','D','C'].filter(a=>g[a]).map(a => `<h3 class="label">${A[a]}</h3>` + g[a].map(it => {
    const key = it.name+'|'+it.u, done = S.ticked[key];
    return `<label class="${done?'done':''}"><input type="checkbox" data-key="${key}" ${done?'checked':''}><span>${it.name}</span><span class="qty">${fmt(it.q,it.u)}</span></label>`;
  }).join('')).join('');
  if (g.S) html += `<h3 class="label">Check you have</h3><div class="staples">${g.S.map(x=>x.name).join(', ')}</div>`;
  $('shop').innerHTML = html;
}

// ISO week number for the masthead
(function(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-(d.getDay()+6)%7);
  const w1=new Date(d.getFullYear(),0,4); const n=1+Math.round(((d-w1)/864e5-3+(w1.getDay()+6)%7)/7);
  $('weekno').textContent = 'Week ' + String(n).padStart(2,'0'); })();

// ---------- Events ----------
['kcal','protein','carbs','fat','share','people'].forEach(k => $(k).addEventListener('input', e => {
  const v = parseFloat(e.target.value); if (!isFinite(v) || v<=0) return;
  S.settings[k] = v; save(); render();
}));
$('gen').onclick = generate;
$('days').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const day = e.target.closest('.day'), i = +day.dataset.i;
  if (el.dataset.act==='swap') swap(i);
  if (el.dataset.act==='lock'){ S.locked[i] = !S.locked[i]; save(); render(); }
  if (el.dataset.act==='open') day.classList.toggle('open');
});
$('shop').addEventListener('change', e => {
  const k = e.target.dataset.key; if (!k) return;
  S.ticked[k] = e.target.checked; save(); e.target.closest('label').classList.toggle('done', e.target.checked);
});
$('copy').onclick = () => {
  const g = shopping();
  const txt = ['M','V','D','C'].filter(a=>g[a]).map(a => A[a].toUpperCase()+'\n'+g[a].map(it=>`- ${it.name} ${fmt(it.q,it.u)}`).join('\n')).join('\n\n')
    + (g.S ? '\n\nCHECK YOU HAVE\n'+g.S.map(x=>'- '+x.name).join('\n') : '');
  navigator.clipboard.writeText(txt).then(()=>toast('Shopping list copied')).catch(()=>toast('Copy failed'));
};
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }

if (!S.plan || S.plan.length !== 5 || S.plan.some(id=>!byId(id))) { S.locked=[]; generate(); } else render();
</script>
</body>
</html>
