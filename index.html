<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WhatsCooking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --ink:#0b0b0b; --muted:#6b6b6b; --soft:#f3f3f1; --line:#e8e8e6;
  --c1:#2b4cf5; --c2:#ef2f6b; --c3:#0e9a5c; --c4:#f5a400; --c5:#7a3cf0;
  --tint:#fdf0d5; --ok:#0e9a5c; --warn:#d9480f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b0b0b; --ink:#f5f5f3; --muted:#9a9a96; --soft:#1a1a19; --line:#262624; --tint:#2a2210; }
}
:root[data-theme="dark"]{ --bg:#0b0b0b; --ink:#f5f5f3; --muted:#9a9a96; --soft:#1a1a19; --line:#262624; --tint:#2a2210; }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:17px/1.45 "Schibsted Grotesk",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px calc(48px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:0;background:none}
.muted{color:var(--muted)}

/* nav */
nav{display:flex;align-items:center;gap:4px;margin-bottom:28px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;margin-right:18px}
.tab{white-space:nowrap;padding:6px 14px;border-radius:99px;font-size:15px;font-weight:500;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--soft);color:var(--ink)}

h1{font-size:clamp(44px,8vw,68px);font-weight:800;letter-spacing:-.035em;line-height:1;margin:0}
.sub{font-size:15px;color:var(--muted);margin:8px 0 14px}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:520px;margin-bottom:24px}
.progress i{height:4px;border-radius:99px;background:var(--line)}

.note{background:var(--tint);border-radius:18px;padding:14px 18px;font-size:15px;margin-bottom:14px}
.note b{font-weight:700}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 32px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}

/* hero */
.hero{background:var(--c);color:#fff;border-radius:28px;padding:24px 24px 26px;position:relative;overflow:hidden}
.hero .num{font-size:clamp(200px,30vw,280px);font-weight:900;line-height:.8;letter-spacing:-.06em;margin:4px 0 14px -6px}
.hero .eyebrow{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.22)}
.hero h2{font-size:clamp(34px,4.6vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:8px 0 10px}
.hero .meta{font-size:14px;opacity:.9}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{padding:10px 18px;border-radius:99px;font-size:15px;font-weight:700;border:2px solid rgba(255,255,255,.6);color:#fff}
.btn:hover{border-color:#fff}
.btn.solid{background:#fff;color:var(--c);border-color:#fff}
.hero.done{background:var(--soft);color:var(--ink)}
.hero.done .btn{color:var(--ink);border-color:var(--line)}
.hero.done .btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* macro bars inside hero */
.mbars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;margin-top:16px}
.mbar{height:6px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.mbar i{display:block;height:100%;background:#fff;border-radius:99px}
.hero.done .mbar{background:var(--line)} .hero.done .mbar i{background:var(--ink)}

/* week list */
.label{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 8px}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.tile{flex:none;width:44px;height:44px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.row.cooked .tile{background:var(--soft);color:var(--muted)}
.row.cooked .rtitle{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.row.active .tile{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.rbody{flex:1;min-width:0}
.rtitle{font-weight:700;font-size:16px;line-height:1.25}
.rmeta{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-size:20px}
.lockdot{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px}

.card{background:var(--soft);border-radius:20px;padding:16px 18px}
.card + .card{margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.stat.off b{color:var(--warn)}
.small{font-size:14px;color:var(--muted)}
.small p{margin:0 0 6px}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px}
.pill.ghost{background:var(--soft);color:var(--ink)}

/* recipe view */
.back{font-weight:600;font-size:15px;color:var(--muted);margin-bottom:12px;display:inline-block}
.rhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.rhead .tile{width:64px;height:64px;font-size:34px;border-radius:16px}
.rhead h1{font-size:clamp(34px,5.5vw,52px)}
ol.method{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.method li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
ol.method li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:99px;background:var(--c);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center}

/* shopping */
.aisle{margin-bottom:22px}
.aisle h3{font-size:15px;font-weight:800;margin:0 0 2px;display:flex;justify-content:space-between}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item input{appearance:none;flex:none;width:22px;height:22px;border-radius:99px;border:2px solid var(--line);margin:0;display:grid;place-items:center;cursor:pointer}
.item input:checked{background:var(--ok);border-color:var(--ok)}
.item input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.item .nm{flex:1}
.item .q{color:var(--muted);font-size:15px;white-space:nowrap}
.item.done .nm{color:var(--muted);text-decoration:line-through}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:3px;background:var(--c)}

/* macros form */
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.fields{grid-template-columns:1fr 1fr}}
.field{background:var(--soft);border-radius:18px;padding:12px 14px}
.field span{font-size:13px;font-weight:600;color:var(--muted)}
.field input{display:block;width:100%;border:0;background:transparent;font-size:30px;font-weight:800;letter-spacing:-.03em;padding:0;outline:none}
.field:focus-within{box-shadow:0 0 0 2px var(--ink) inset}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:480px){.brand{margin-right:auto;font-size:17px}.tab{padding:5px 9px;font-size:14px}}

/* lunch stickers */
.slot{flex:none;display:grid;place-items:center;min-width:74px;height:34px}
.lslot{font-size:12px;font-weight:700;color:var(--muted);border:1.5px dashed var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.lslot:hover{color:var(--ink);border-color:var(--muted)}
.sticker{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;background:#ffd23f;color:#111;
  padding:6px 11px;border-radius:99px;transform:rotate(-7deg);box-shadow:0 2px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.12);
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;white-space:nowrap}
.sticker:active{cursor:grabbing}
.sticker.float{position:fixed;z-index:50;pointer-events:none;transform:rotate(4deg) scale(1.12);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.row.drop,.hero.drop{outline:2px dashed var(--ink);outline-offset:4px;border-radius:14px}
.hero.drop{border-radius:28px}
.tray{display:flex;gap:16px;align-items:center}
.tray .stack{position:relative;flex:none;width:86px;height:40px}
.tray .stack .sticker{position:absolute;left:4px;top:6px}
.tray .stack .sticker.under{transform:rotate(5deg);left:10px;top:4px;opacity:.6;pointer-events:none;box-shadow:none}
.hero .sticker{margin-left:2px;cursor:default}

.shop-sec{margin-bottom:28px}
.shop-sec .shophead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);margin-bottom:12px;padding-bottom:6px}
.shop-sec h2{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0}
.subtotal{font-size:22px;font-weight:800}
.nm{display:flex;flex-direction:column;min-width:0}
.pn{font-weight:600;line-height:1.25}
.pn a:hover{text-decoration:underline}
.pd{font-size:13px;color:var(--muted)}
.price{font-family:inherit;font-weight:700;font-size:15px;padding:4px 8px;border-radius:8px}
.price:hover{background:var(--soft)}
.price.edited{background:#fff3c4;color:#111}
.totals .stats{grid-template-columns:repeat(3,1fr)}

.extras{margin-bottom:28px}
.addrow{display:flex;gap:8px;margin:10px 0 4px}
.addrow input{flex:1;min-width:0;border:0;background:var(--bg);border-radius:99px;padding:10px 16px;font-size:16px;outline:none}
.addrow input:focus{box-shadow:0 0 0 2px var(--ink) inset}
.extras .item:last-child{border-bottom:0}
.sync{margin-top:16px}
.sync .field{background:var(--bg);margin:10px 0}
.card .pill.ghost{background:var(--bg)}
.sync .field input{font-size:16px;font-weight:500;letter-spacing:0;padding-top:2px}
.syncbadge{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.syncbadge::before{content:"";width:8px;height:8px;border-radius:99px;background:var(--dot,#9a9a96)}
.syncbadge[data-s="ok"]{--dot:#0e9a5c}
.syncbadge[data-s="syncing"]{--dot:#f5a400}
.syncbadge[data-s="offline"],.syncbadge[data-s="auth"]{--dot:#d9480f}
@media (max-width:480px){.syncbadge{font-size:0;gap:0}}

.xhead{display:flex;justify-content:space-between;align-items:baseline}
.subx{font-weight:800}
.price.alt{color:var(--muted);font-weight:600;padding:4px 6px}
.price.alt:hover{color:var(--ink)}
.extras .pd a:hover{text-decoration:underline}
.srclink{margin-top:14px}
</style>
</head>

function sing(w){ if(w.length<=3) return w; if(w.endsWith('ies')) return w.slice(0,-3)+'y'; if(w.endsWith('oes')) return w.slice(0,-2); if(w.endsWith('s') && !w.endsWith('ss')) return w.slice(0,-1); return w; }
const toks = t => String(t).toLowerCase().replace(/[^a-z0-9%.]+/g,' ').trim().split(/\s+/).filter(Boolean).map(sing);
const CATX = (()=>{
  const out = CAT.map(([n,b,sz,pr,sl,a]) => ({ n: b && !n.toLowerCase().includes(b.toLowerCase().split(' ')[0]) ? b+' '+n : n, base:n, sz, pr, u: sl?AL+sl:'', a }));
  Object.values(P).forEach(p => { if(p.s==='A' && p.packs) p.packs.forEach(([,pr,l]) => out.push({ n:p.n, base:p.n, sz:l, pr, u:p.u, a:'R' })); });
  out.forEach(o => { o.key = o.base+'|'+o.sz; o.t = toks(o.n); });
  return out;
})();
const byKey = k => CATX.find(o => o.key === k);
function parseItem(text){
  let t = String(text).trim().toLowerCase(), qty = 1;
  const m = t.match(/^(\d+)\s*(x|×)?\s+(.*)$/) || t.match(/^(.*?)\s*(x|×)\s*(\d+)$/);
  if (m){ if (/^\d+$/.test(m[1])) { qty = +m[1]; t = m[3]; } else { qty = +m[3]; t = m[1]; } }
  SYN.forEach(([re,to]) => { t = t.replace(re, to); });
  return { q: t.replace(/\s+/g,' ').trim(), qty: Math.max(1, Math.min(qty, 50)) };
}
function candidates(text){
  const { q } = parseItem(text), qt = toks(q).filter(w => !STOP.has(w)); if (!qt.length) return [];
  const res = [];
  CATX.forEach(o => {
    let exact = 0;
    for (const w of qt){ if (o.t.includes(w)) { exact++; continue; }
      if (!o.t.some(x => x.length>=3 && (x.startsWith(w) || (w.length>=4 && w.startsWith(x))))) return; }
    const variants = VARIANT.filter(v => o.t.includes(v) && !qt.includes(v)).length;
    res.push({ o, sc: exact*10 - variants*6 - (o.t.length - qt.length) });
  });
  res.sort((a,b) => b.sc - a.sc || a.o.pr - b.o.pr);
  const uniq = []; res.forEach(r => { if (!uniq.some(u => u.key === r.o.key)) uniq.push(r.o); });
  const pref = PREF[toks(q).filter(w=>!STOP.has(w)).join(' ')] || PREF[q];
  const pi = pref ? uniq.findIndex(o => o.key === pref) : -1;
  if (pi > 0) uniq.unshift(uniq.splice(pi,1)[0]);
  else if (pi < 0 && pref && byKey(pref)) uniq.unshift(byKey(pref));
  const { qty } = parseItem(text);
  if (qty >= 5){ const fit = uniq.findIndex(o => /^\d+$/.test(o.sz) && +o.sz === qty); if (fit > 0) uniq.unshift(uniq.splice(fit,1)[0]); }
  // keep alternatives in the same aisle as the best match (milk → other milks, not almond hand wash)
  if (uniq.length){ const aisle = g => g === 'R' ? 'X' : g, home = aisle(uniq[0].a);
    const rest = uniq.slice(1), same = rest.filter(o => aisle(o.a) === home || o.a === 'R');

}

function packsFor(it, qty){ return (qty >= 5 && it && /^\d+$/.test(it.sz) && +it.sz > 1) ? Math.ceil(qty / +it.sz) : qty; }
function matchExtra(v){ const c = candidates(v.t); return { ...v, m: c.length ? c[0].key : '' }; }
function extraInfo(v){
  const it = v.m ? byKey(v.m) : null, qty = packsFor(it, parseItem(v.t).qty);
  const unit = typeof v.p === 'number' ? v.p : it ? it.pr : null;
  return { it, qty, cost: unit == null ? null : unit*qty };
}
function checkExtras(force){
  let priced = 0, total = 0;
  extrasList().forEach(([id,v]) => { total++;
    if (force || v.m === undefined || (v.m && !byKey(v.m))) put('extras.'+id, matchExtra(v));
    if (extraInfo(S.extras[id]).cost != null) priced++; });

// Cheapest way to cover `need` from the pack sizes (single size, or big packs + one smaller top-up)
function bestPacks(key, need){
  const p = P[key]; if (!p) return null;
  if (p.perKg){ const price = priceOf(key, 'kg', p.perKg); return {buy:[{label:`≈${Math.round(need/10)*10}g by weight`, n:1}], cost: need/1000*price, perKg:true}; }
  const packs = p.packs.map(([size,price,label]) => ({size, label, price: priceOf(key, label, price)}));
  let best = null;
  const consider = (buy) => { const cost = buy.reduce((a,b)=>a+b.n*b.price,0), got = buy.reduce((a,b)=>a+b.n*b.size,0);
    if (!best || cost < best.cost - 1e-9 || (Math.abs(cost-best.cost)<1e-9 && got < best.got)) best = {buy:buy.filter(b=>b.n), cost, got}; };
  packs.forEach(a => consider([{...a, n:Math.max(1,Math.ceil(need/a.size - 1e-9))}]));
  packs.forEach(big => packs.forEach(small => { if (small.size >= big.size) return;
    const nb = Math.floor(need/big.size), rem = need - nb*big.size; if (!nb || rem <= 0) return;
    consider([{...big, n:nb}, {...small, n:Math.ceil(rem/small.size - 1e-9)}]); }));
  return best;
}
function priceOf(key, label, base){ const o = S.prices && S.prices[key+'|'+label]; return (typeof o === 'number' && o >= 0) ? o : base; }

function targets(){ const s=S.settings,k=s.share/100; return {kcal:s.kcal*k,p:s.protein*k,c:s.carbs*k,f:s.fat*k}; }
function scaleFor(r){ return Math.min(1.4, Math.max(0.75, targets().kcal / r.kcal)); }
function scaled(r){ const s=scaleFor(r); return {kcal:r.kcal*s,p:r.p*s,c:r.c*s,f:r.f*s,s}; }
function score(r){
  const t=targets(), m=scaled(r);
  return Math.max(0,t.p-m.p)/t.p*3 + Math.abs(m.c-t.c)/t.c*.6 + Math.abs(m.f-t.f)/t.f*.6 + Math.abs(m.kcal-t.kcal)/t.kcal;
}
function pick(exclude, used){
  let pool = R.filter(r=>!exclude.includes(r.id));
  const fresh = pool.filter(r=>(used[r.tag]||0)<2); if (fresh.length) pool = fresh;
  const w = pool.map(r=>Math.exp(-score(r)*4)); let x = Math.random()*w.reduce((a,b)=>a+b,0);
  for (let i=0;i<pool.length;i++){ x-=w[i]; if(x<=0) return pool[i].id; }
  return pool[pool.length-1].id;
}
function tagsOf(ids){ const t={}; ids.forEach(id=>{ const r=id&&byId(id); if(r){ t[r.tag]=(t[r.tag]||0)+1; } }); return t; }
function generate(initial){
  const ts = initial ? 0 : undefined;   // a brand-new device's starter week never overrides a synced one
  const plan = DAYS.map((_,i)=>S.locked[i]?S.plan[i]:null);
  DAYS.forEach((_,i)=>{ if(!plan[i]) plan[i]=pick(plan.filter(Boolean),tagsOf(plan)); });
  DAYS.forEach((_,i)=>{ if(!S.locked[i]) put('cooked.'+i,false,ts); });
  put('plan',plan,ts); untickAll(ts); save(); route();
}
function swap(i){
  const others=S.plan.filter((_,j)=>j!==i);
  const plan=[...S.plan]; plan[i]=pick([...others,S.plan[i]],tagsOf(others));
  put('plan',plan); put('cooked.'+i,false); untickAll(); save(); route();
  toast('Swapped '+DAYS[i]);
}

// ---------- Quantities ----------
function fmt(q,u){
  if (u==='g'&&q>=1000) return (q/1000).toFixed(2).replace(/\.?0+$/,'')+' kg';
  if (u==='g'||u==='ml') return Math.round(q/5)*5+' '+u;
  if (u==='tin'){ const v=Math.ceil(q*2)/2; return v+(v===1?' tin':' tins'); }
  if (u==='clove'){ const v=Math.ceil(q); return v+(v===1?' clove':' cloves'); }
  if (u==='') return '× '+Math.ceil(q);
  return (Math.round(q*2)/2)+' '+u;
}
function portion(q,u,s,n,L=0){
  if (!q) return '';
  if (u==='tsp'||u==='tbsp') return (q*(n+L))+' '+u;
  if (u==='g'||u==='ml') return Math.round((q*s*n+q*L)/5)*5+' '+u;
  const v=Math.round((q*s*n+q*L)*4)/4, nice=v%1===0?v:v.toFixed(2).replace(/0$/,'');
  return u===''?nice:nice+' '+u+(v>1?'s':'');
}
function shopping(){
  const n=S.settings.people, items={};
  S.plan.forEach((id,di)=>{ const r=byId(id); if(!r) return; const s=scaleFor(r), L=S.lunch[di]?1:0;
    r.i.forEach(([name,q,u,a])=>{ const key=name+'|'+u, mult=(a==='S'||u==='tsp'||u==='tbsp')?n+L:n*s+L;
      items[key]=items[key]||{name,u,a,q:0,days:new Set()}; items[key].q+=q*mult; items[key].days.add(di); }); });
  const g={}; Object.values(items).forEach(it=>(g[it.a]=g[it.a]||[]).push(it));
  Object.values(g).forEach(x=>x.sort((a,b)=>a.name.localeCompare(b.name))); return g;
}

function shopRows(){
  const g=shopping(), rows=[];
  ['M','V','D','C'].forEach(a => (g[a]||[]).forEach(it => {
    if (P[it.name]) rows.push({...it, shop:P[it.name].s, prod:P[it.name], bp:bestPacks(it.name,it.q)});
    else { const c = catRow(it); rows.push({...it, shop:'A', prod:c && {n:c.it.n, u:c.it.u}, bp:c && c.bp}); }
  }));
  return rows;
}
// ingredients from imported recipes: what to look for in the Aldi catalogue (null = no good Aldi match)
const CAT_ALIAS = {'Rice pouch (cooked)':'basmati rice pouch','Quinoa pouch (cooked)':'quinoa pouch','Puy lentils (cooked)':null,'Grated cheese':'grated mature cheddar',
  'Single cream':'single cream','Natural yogurt':'fat free natural yogurt','Butter':'salted butter','Eggs':'eggs','Tortilla wraps':'white tortilla wraps','Bread':'medium sliced wholemeal bread',
  'Cucumber':'cucumber','Tomatoes':'salad tomatoes','Vine tomatoes':'vine ripened tomatoes','Cauliflower':'cauliflower','Orzo':'orzo pasta','Mascarpone':'mascarpone',
  'Cooked beetroot':'cooked beetroot','Peanut butter':'smooth peanut butter','Light cream cheese':null,'Fresh herbs':null,'Chicken mince':null,'Beef minute steak':null};
function sizeOf(sz){ const m=String(sz).match(/^([\d.]+)\s*(kg|g|ml|l)\b/i); if(m){ const q=+m[1], u=m[2].toLowerCase(); return u==='kg'?{q:q*1000,u:'g'}:u==='l'?{q:q*1000,u:'ml'}:{q,u}; }
  return /^\d+$/.test(sz) ? {q:+sz,u:''} : null; }
const catCache = {};
function catRow(it){
  if (!(it.name in CAT_ALIAS)) return null;
  const q = CAT_ALIAS[it.name]; if (!q) return null;
  const key = it.name; if (!(key in catCache)) catCache[key] = candidates(q)[0] || null;
  const c = catCache[key]; if (!c) return null;
  const sz = sizeOf(c.sz); let n;
  if (it.u === 'slice') n = Math.ceil(it.q/20 - 1e-9);
  else if (sz && sz.u === it.u) n = Math.ceil(it.q/sz.q - 1e-9);
  else if (sz && sz.u === '' && it.u === '') n = Math.ceil(it.q/sz.q - 1e-9);
  else n = it.u === '' ? Math.ceil(it.q - 1e-9) : 1;
  n = Math.max(1, n);
  return { it:c, bp:{ buy:[{label:c.sz||'pack', n, price:c.pr}], cost:n*c.pr } };
}
function totals(rows=shopRows()){ const t={A:0,S:0,X:0}; rows.forEach(r=>{ if(r.bp) t[r.shop]+=r.bp.cost; });
  extrasList().forEach(([,v])=>{ const c=extraInfo(v).cost; if(c!=null) t.X+=c; }); t.A+=t.X; t.all=t.A+t.S; return t; }
const packStr = bp => bp ? bp.buy.map(b=>(b.n>1?b.n+' × ':'')+b.label).join(' + ') : '';

// ---------- Helpers ----------
const k0 = v => Math.round(v);
const macroLine = m => `≈${k0(m.kcal)} kcal, ≈${k0(m.p)}g protein, ${k0(m.c)}g carbs, ${k0(m.f)}g fat`;
function weekRange(){
  const d=new Date(), dow=(d.getDay()+6)%7; const mon=new Date(d); mon.setDate(d.getDate()-dow);
  const fri=new Date(mon); fri.setDate(mon.getDate()+4);
  const M=x=>x.toLocaleDateString('en-GB',{month:'long'});
  return mon.getMonth()===fri.getMonth() ? `${mon.getDate()}–${fri.getDate()} ${M(fri)}` : `${mon.getDate()} ${M(mon).slice(0,3)} – ${fri.getDate()} ${M(fri).slice(0,3)}`;
}
const lunches = () => S.lunch.slice(0,5).filter(Boolean).length;
function nextIndex(){ const i=S.cooked.findIndex((c,j)=>j<5&&!c); return i===-1?null:i; }

// ---------- Views ----------

  const r=byId(S.plan[hi]), m=scaled(r);

  const bar=(l,v,tt)=>`<span>${l}</span><div class="mbar"><i style="width:${Math.min(100,v/tt*100)}%"></i></div><span>${k0(v)}/${k0(tt)}g</span>`;
  const avg=S.plan.reduce((a,id)=>{const x=scaled(byId(id));a.kcal+=x.kcal;a.p+=x.p;a.c+=x.c;a.f+=x.f;return a;},{kcal:0,p:0,c:0,f:0});
  const stat=(l,v,tt,u)=>`<div class="stat ${(l==='protein'?v/tt<.88:l==='kcal'?Math.abs(v/tt-1)>.12:false)?'off':''}"><b>${k0(v)}${u}</b><span>${l} · ${k0(tt)}${u}</span></div>`;

  return `
  <h1>${weekRange()}</h1>
  <div class="sub">${done} of 5 cooked · ${items} things to buy (≈${gbp(totals().all)}) · ${S.settings.people} ${S.settings.people>1?'people':'person'}${lunches()?` + ${lunches()} lunch${lunches()>1?'es':''}`:''}</div>
  <div class="progress">${prog}</div>
  ${nx===null?`<div class="note">🎉 <b>All five cooked.</b> Pick next week when you're ready.</div>`:''}
  <div class="grid">
    <div>
      <section class="hero ${nx===null?'done':''}" data-i="${hi}" style="--c:${COL[hi]}">
        <div class="num">${hi+1}</div>
        <div class="eyebrow">${nx===null?'Last up':'Up next'} · ${DAYS[hi]} <span class="chip">${r.tag}</span>${Math.abs(m.s-1)>.04?`<span class="chip">${m.s.toFixed(2).replace(/0$/,'')}× portion</span>`:''}${S.lunch[hi]?'<span class="sticker" data-from="'+hi+'">+ Lunch</span>':''}</div>
        <h2>${r.name}</h2>
        <div class="meta">${macroLine(m)}</div>
        <div class="mbars">${bar('P',m.p,t.p)}${bar('C',m.c,t.c)}${bar('F',m.f,t.f)}</div>
        <div class="btns">
          <a class="btn solid" href="#/recipe/${hi}">See recipe</a>
          <button class="btn" data-act="cook" data-i="${hi}">${S.cooked[hi]?'Cooked ✓':'Mark cooked'}</button>
          <button class="btn" data-act="swap" data-i="${hi}" ${S.locked[hi]?'disabled style="opacity:.4"':''}>Swap</button>
        </div>
      </section>
    </div>
    <div>
      <p class="label">The week</p>
      <div>${S.plan.map((id,i)=>{ const x=byId(id), mm=scaled(x);
        return `<a class="row ${S.cooked[i]?'cooked':''} ${i===hi?'active':''}" data-i="${i}" href="#/recipe/${i}" style="--c:${COL[i]}">
          <div class="tile">${i+1}</div>
          <div class="rbody"><div class="rtitle">${x.name}${S.locked[i]?'<span class="lockdot">LOCKED</span>':''}</div>
          <div class="rmeta">${DAYS[i].slice(0,3)} · ≈${k0(mm.kcal)} kcal, ≈${k0(mm.p)}g protein${x.mins?` · ${x.mins} min`:''}${x.by?` · ${x.by}`:''}</div></div>
          <span class="slot" data-slot="${i}">${S.lunch[i]?`<span class="sticker" data-from="${i}">+ Lunch</span>`:'<span class="lslot">+ lunch</span>'}</span>
          <span class="chev">›</span></a>`; }).join('')}</div>
      <div class="card tray" style="margin-top:12px">
        <div class="stack"><span class="sticker under">+ Lunch</span><span class="sticker" data-from="tray">+ Lunch</span></div>
        <div><b>Lunch for tomorrow</b><div class="small">Drag a sticker onto a dinner to cook an extra portion for the next day. Drag it off to remove. ${lunches()?`<b style="color:var(--ink)">${lunches()} this week.</b>`:''}</div></div>
      </div>
      <div class="card" style="margin-top:16px">
        <div style="display:flex;justify-content:space-between;align-items:center"><b>Average dinner</b><a class="small" href="#/macros">Edit macros ›</a></div>
        <div class="stats">${stat('kcal',avg.kcal/5,t.kcal,'')}${stat('protein',avg.p/5,t.p,'g')}${stat('carbs',avg.c/5,t.c,'g')}${stat('fat',avg.f/5,t.f,'g')}</div>

        <span>Not feeling it? Reshuffle everything you haven't locked.</span>
        <button class="pill" data-act="gen">New week</button>
      </div>
      <p class="small" style="margin-top:14px">● Saved on this device · macros are estimates</p>
    </div>
  </div>`;
}

function viewShop(){
  const rows=shopRows(), t=totals(rows), g=shopping();
  const ex=extrasList(), got=rows.filter(x=>S.ticked[x.name+'|'+x.u]).length + ex.filter(([,v])=>v.done).length;
  const shopSec = sh => {
    const list=rows.filter(r=>r.shop===sh); if(!list.length) return '';
    const left=list.filter(r=>r.a==='M'||r.a==='V'), right=list.filter(r=>r.a==='D'||r.a==='C');
    const col = items => ['M','V','D','C'].map(a=>{ const its=items.filter(r=>r.a===a); return its.length?aisle(a,its):''; }).join('');
    return `<section class="shop-sec"><div class="shophead"><h2>${SHOP[sh]}</h2><span class="subtotal">${gbp(t[sh])}</span></div>
      <div class="grid">${list.length>6?`<div>${col(left)}</div><div>${col(right)}</div>`:`<div>${col(list)}</div>`}</div></section>`;
  };
  return `<h1>Shopping</h1>
  <div class="sub">${got} of ${rows.length+ex.length} in the basket · for ${weekRange()}${lunches()?` · includes ${lunches()} lunch${lunches()>1?'es':''}`:''}</div>

      <div class="stat"><b>${gbp(t.all)}</b><span>estimated total</span></div>
      <div class="stat"><b>${gbp(t.A)}</b><span>Aldi</span></div>
      <div class="stat"><b>${gbp(t.S)}</b><span>Sainsbury's</span></div></div>
    <div class="small" style="margin-top:8px">Prices checked ${PRICED}. Tap a price to change it to what you paid.</div></div>
  <div class="btns" style="margin:14px 0 26px"><button class="pill" data-act="copy">Copy list</button>${got?`<button class="pill ghost" data-act="untick">Untick all</button>`:''}</div>
  <section class="card extras"><div class="xhead"><b>Added items</b>${ex.length?`<span class="subx">${gbp(t.X)}</span>`:''}</div>
    <div class="addrow"><input id="xtra" placeholder="Milk, bin bags, snacks…" autocomplete="off" enterkeyhint="done"><button class="pill" data-act="addx">Add</button></div>
    ${ex.map(([id,v])=>{ const x=extraInfo(v), it=x.it;
      const sub = it ? `Aldi · ${it.u?`<a href="${it.u}" target="_blank" rel="noopener">${esc(it.n)}</a>`:esc(it.n)}${it.sz?' · '+esc(it.sz):''}${x.qty>1?` · ×${x.qty}`:''}`
                : typeof v.p==='number' ? 'Your price' : v.m==='' ? 'No Aldi match — tap the price to add one' : 'Not checked yet — tap Check Aldi prices';
      return `<label class="item ${v.done?'done':''}"><input type="checkbox" data-extra="${id}" ${v.done?'checked':''}>

        ${it?`<button class="price alt" data-act="altx" data-id="${id}" title="Try another product">↻</button>`:''}
        <button class="price ${typeof v.p==='number'?'edited':''}" data-act="xprice" data-id="${id}">${x.cost!=null?gbp(x.cost):'£ –'}</button>
        <button class="price alt" data-act="delx" data-id="${id}" aria-label="Remove ${esc(v.t)}">✕</button></label>`; }).join('')}
    ${ex.length?`<div class="btns" style="margin-top:10px"><button class="pill" data-act="checkx">Check Aldi prices</button></div>`:''}
  </section>
  ${shopSec('A')}${shopSec('S')}
  ${g.S?`<div class="card small"><b style="color:var(--ink)">Check you have</b><p style="margin-top:4px">${g.S.map(x=>x.name).join(', ')}</p></div>`:''}`;
}
function aisle(a,list){
  return `<div class="aisle"><h3>${A[a]}<span class="muted" style="font-weight:500">${list.length}</span></h3>${list.map(it=>{
    const key=it.name+'|'+it.u, done=S.ticked[key], pr=it.prod, bp=it.bp;
    const title = pr ? (pr.u ? `<a href="${pr.u}" target="_blank" rel="noopener">${pr.n}</a>` : pr.n) : it.name;
    const lbl = bp ? (bp.perKg ? 'kg' : bp.buy[bp.buy.length-1].label) : '';
    const edited = pr && S.prices[it.name+'|'+lbl] != null;
    return `<label class="item ${done?'done':''}"><input type="checkbox" data-key="${key}" ${done?'checked':''}>
      <span class="nm"><span class="pn">${title}</span><span class="pd">Need ${fmt(it.q,it.u).replace('× ','')} · buy ${packStr(bp)||'—'}</span></span>
      <span class="dots">${[...it.days].sort().map(d=>`<i style="--c:${COL[d]}" title="${DAYS[d]}"></i>`).join('')}</span>
      ${bp?`<button class="price ${edited?'edited':''}" data-act="price" data-key="${it.name}" data-label="${lbl}">${gbp(bp.cost)}</button>`:''}</label>`;
  }).join('')}</div>`;
}

// ---------- Router ----------
function route(){
  const h=location.hash.replace(/^#\/?/,''), [p,arg]=h.split('/');
  const name = p==='shop'?'shop':p==='macros'?'macros':'week';
  document.querySelectorAll('.tab').forEach(a=>a.classList.toggle('on',a.dataset.r===name));
  $('app').innerHTML = p==='recipe' ? viewRecipe(+arg) : p==='shop' ? viewShop() : p==='macros' ? viewMacros() : viewWeek();
  document.title = (p==='shop'?'Shopping':p==='macros'?'Macros':weekRange()) + ' – WhatsCooking';
}
addEventListener('hashchange', ()=>{ route(); scrollTo(0,0); });

// ---------- Events ----------
let justDragged=false;
$('app').addEventListener('click', e=>{
  if (justDragged){ e.preventDefault(); justDragged=false; return; }
  const slot=e.target.closest('[data-slot]');
  if (slot){ e.preventDefault(); if(e.target.closest('.lslot')) setLunch(+slot.dataset.slot,true); return; }
  if (e.target.closest('.sticker')){ e.preventDefault(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; e.preventDefault();
  const i=+b.dataset.i, a=b.dataset.act;
  if(a==='gen'){ generate(); toast('New week picked'); if(location.hash.includes('macros')) location.hash='#/'; }
  if(a==='swap') swap(i);
  if(a==='cook'){ put('cooked.'+i,!S.cooked[i]); save(); route(); if(S.cooked[i]) toast(DAYS[i]+' cooked'); }
  if(a==='lock'){ put('locked.'+i,!S.locked[i]); save(); route(); }
  if(a==='lunch') setLunch(i,!S.lunch[i]);
  if(a==='untick'){ untickAll(); Object.entries(S.extras).forEach(([id,v])=>{ if(v&&v.done) put('extras.'+id,{...v,done:false}); }); save(); route(); }
  if(a==='addx') addExtra();
  if(a==='delx'){ put('extras.'+b.dataset.id,null); save(); route(); }
  if(a==='checkx') checkExtras(false);
  if(a==='altx'){ const id=b.dataset.id, v=S.extras[id], c=candidates(v.t); if(c.length<2){ toast('No other matches'); return; }
    const i=c.findIndex(o=>o.key===v.m), nx=c[(i+1)%c.length]; const nv={...v, m:nx.key}; delete nv.p; put('extras.'+id, nv); save(); route(); toast(nx.n+(nx.sz?' · '+nx.sz:'')); }
  if(a==='xprice'){ const id=b.dataset.id, v=S.extras[id], x=extraInfo(v), unit=x.cost!=null?x.cost/x.qty:null;
    const r=prompt(`${v.t}${x.qty>1?` (price for one, ×${x.qty})`:''}\nWhat does it cost? (leave blank to reset)`, unit!=null?unit.toFixed(2):'');
    if(r===null) return; const nv={...v}; if(String(r).trim()===''){ delete nv.p; } else { const n=parseFloat(String(r).replace('£','')); if(!isFinite(n)||n<0) return; nv.p=n; }
    put('extras.'+id, nv); save(); route(); }
  if(a==='syncon'){
    const repo=$('syncRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''), token=$('syncToken').value.trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token){ toast('Add the repo and token'); return; }
    SY.cfg={repo,token}; try{ localStorage.setItem('wc-sync', JSON.stringify(SY.cfg)); }catch(e){}
    route(); syncNow(); loadPrivate();
  }
  if(a==='syncnow') syncNow();
  if(a==='syncoff'){ if(!confirm('Stop syncing on this device? Your week stays here.')) return; SY.cfg=null; try{ localStorage.removeItem('wc-sync'); }catch(e){} setSync('off'); route(); }
  if(a==='price'){
    const k=b.dataset.key, l=b.dataset.label, pr=P[k], cur=priceOf(k,l, l==='kg'?pr.perKg:(pr.packs.find(x=>x[2]===l)||[])[1]);
    const v=prompt(`${pr.n} — ${l==='kg'?'price per kg':l}\nWhat did it cost? (leave blank to reset)`, cur.toFixed(2));
    if(v===null) return; const x=parseFloat(String(v).replace('£',''));
    if(String(v).trim()==='') put('prices.'+k+'|'+l,null); else if(isFinite(x)&&x>=0) put('prices.'+k+'|'+l,x); else return;
    save(); route();
  }
  if(a==='copy'){
    const rows=shopRows(), t=totals(rows), g=shopping();
    const txt=['A','S'].map(sh=>{ const l=rows.filter(r=>r.shop===sh); if(!l.length) return '';
      return SHOP[sh].toUpperCase()+` (${gbp(t[sh])})\n`+l.map(r=>`- ${r.prod?r.prod.n:r.name} — ${packStr(r.bp)} ${r.bp?gbp(r.bp.cost):''}`).join('\n'); }).filter(Boolean).join('\n\n')
      +(extrasList().length?'\n\nALSO\n'+extrasList().map(([,v])=>{ const x=extraInfo(v); return '- '+v.t+(x.it?` (${x.it.n})`:'')+(x.cost!=null?' '+gbp(x.cost):''); }).join('\n'):'')
      +(g.S?'\n\nCHECK YOU HAVE\n'+g.S.map(x=>'- '+x.name).join('\n'):'')+`\n\nEstimated total ${gbp(t.all)}`;
    navigator.clipboard.writeText(txt).then(()=>toast('List copied')).catch(()=>toast('Copy failed'));
  }

});
$('app').addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='xtra'){ e.preventDefault(); addExtra(); } });
function addExtra(){
  const el=$('xtra'); const t=el && el.value.trim(); if(!t) return;
  const v = matchExtra({t, done:false}), it = v.m ? byKey(v.m) : null;
  put('extras.'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), v); save(); route();
  $('xtra')?.focus(); toast(it ? `Added ${t} — ${gbp(extraInfo(v).cost)} at Aldi` : `Added ${t} — no Aldi match, tap £ to price it`);
}
const extrasList = () => Object.entries(S.extras).filter(([,v])=>v && v.t);
$('app').addEventListener('change', e=>{
  const x=e.target.dataset.extra; if(x){ put('extras.'+x,{...S.extras[x],done:e.target.checked}); save(); route(); return; }
  const k=e.target.dataset.key; if(!k) return; put('ticked.'+k,e.target.checked); save(); route();
});
$('app').addEventListener('input', e=>{
  const id=e.target.id; if(!(id in S.settings)) return;
  const v=parseFloat(e.target.value); if(!isFinite(v)||v<=0) return;
  put('settings.'+id,v); save(); const el=$('tgt'); if(el) el.innerHTML=tgt(targets());
});
function setLunch(i,on,quiet){ put('lunch.'+i,on); save(); route(); if(!quiet) toast(on?`Lunch added to ${DAYS[i]}`:`Lunch removed from ${DAYS[i]}`); }

let drag=null;
$('app').addEventListener('pointerdown', e=>{
  const st=e.target.closest('.sticker[data-from]'); if(!st || e.button>0) return;
  e.preventDefault(); st.setPointerCapture?.(e.pointerId);
  drag={from:st.dataset.from, x:e.clientX, y:e.clientY, moved:false, el:null, src:st, target:null};
});
addEventListener('pointermove', e=>{
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
  if(!drag.moved){ drag.moved=true; drag.el=drag.src.cloneNode(true); drag.el.classList.add('float'); document.body.appendChild(drag.el); drag.src.style.opacity=.25; }
  drag.el.style.left=(e.clientX-30)+'px'; drag.el.style.top=(e.clientY-16)+'px';
  const over=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-i]');
  if(drag.target && drag.target!==over) drag.target.classList.remove('drop');
  drag.target=over||null; if(over) over.classList.add('drop');
});
function endDrag(e){
  if(!drag) return; const d=drag; drag=null;
  d.el?.remove(); d.src.style.opacity=''; d.target?.classList.remove('drop');
  justDragged=true; setTimeout(()=>justDragged=false,350);
  if(!d.moved){ if(d.from!=='tray') setLunch(+d.from,false); else toast('Drag me onto a dinner'); return; }
  const to = d.target ? +d.target.dataset.i : null, from = d.from==='tray' ? null : +d.from;
  if (to===null){ if(from!==null) setLunch(from,false); return; }
  if (from!==null && from!==to) put('lunch.'+from,false);
  setLunch(to,true);
}
addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }

// ---------- Live sync between tabs/windows ----------
let lastSaved = null;
function resync(){
  const raw = (()=>{ try{ return localStorage.getItem('wc'); }catch(e){ return null; } })();
  if (!raw || raw === lastSaved) return; lastSaved = raw;
  const next = norm(JSON.parse(raw)); if (next.plan.length !== 5) return;
  S = next;
  const f = document.activeElement;
  if (f && f.tagName === 'INPUT' && f.type === 'number') return;   // don't interrupt typing in Macros
  route();
}
addEventListener('storage', e => { if (e.key === 'wc') resync(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) resync(); });
addEventListener('pageshow', resync);
addEventListener('focus', resync);

// ---------- Household sync via a private GitHub repo ----------
const SY = { cfg:(()=>{ try{ return JSON.parse(localStorage.getItem('wc-sync')); }catch(e){ return null; } })(), sha:null, state:'off', last:null, busy:false, again:false, t:null };
const FILE = 'whatscooking.json', PRIV = 'recipes-private.json';
function addPrivate(list){ if(!Array.isArray(list)) return 0; let n=0; list.forEach(r=>{ if(r && r.id && !R.some(x=>x.id===r.id)){ R.push(r); n++; } }); return n; }
(()=>{ try{ addPrivate(JSON.parse(localStorage.getItem('wc-priv')||'[]')); }catch(e){} })();
async function loadPrivate(){
  if(!SY.cfg) return;
  try{
    const r = await fetch(`https://api.github.com/repos/${SY.cfg.repo}/contents/${PRIV}`, { cache:'no-store', headers:{ Authorization:'Bearer '+SY.cfg.token, Accept:'application/vnd.github+json' } });
    if (r.status !== 200) return;
    const list = JSON.parse(b64d((await r.json()).content)).recipes || [];
    try{ localStorage.setItem('wc-priv', JSON.stringify(list)); }catch(e){}
    if (addPrivate(list)) { const f=document.activeElement; if(!(f && f.tagName==='INPUT')) route(); }
  }catch(e){}
}
const b64e = t => btoa(unescape(encodeURIComponent(t)));
const b64d = t => decodeURIComponent(escape(atob(t.replace(/\s/g,''))));
function gh(method, body){
  return fetch(`https://api.github.com/repos/${SY.cfg.repo}/contents/${FILE}`, { method, cache:'no-store',
    headers:{ Authorization:'Bearer '+SY.cfg.token, Accept:'application/vnd.github+json' }, body: body ? JSON.stringify(body) : undefined });
}
function allPaths(){
  const ps=['plan']; Object.keys(S.settings).forEach(k=>ps.push('settings.'+k));
  for(let i=0;i<5;i++) ps.push('cooked.'+i,'locked.'+i,'lunch.'+i);
  ['ticked','prices','extras'].forEach(a=>Object.keys(S[a]).forEach(k=>ps.push(a+'.'+k)));
  return ps;
}
// take whichever side changed each piece most recently
function mergeIn(remote){
  let changed=false;
  for (const [path,t] of Object.entries(remote._mt||{})){
    if (S._mt[path] >= t) continue;
    const v = getP(remote,path); setP(S, path, v===undefined ? null : JSON.parse(JSON.stringify(v))); S._mt[path]=t; changed=true;
  }
  return changed;
}
const needsPush = remote => Object.entries(S._mt).some(([p,t]) => !((remote._mt||{})[p] >= t));
function queuePush(){ if(!SY.cfg) return; clearTimeout(SY.t); SY.t=setTimeout(syncNow, 1200); }
async function syncNow(){
  if(!SY.cfg) return; if(SY.busy){ SY.again=true; return; }
  SY.busy=true; setSync('syncing');
  try{
    for (let attempt=0; attempt<3; attempt++){
      const r = await gh('GET'); let remote=null;
      if (r.status===200){ const j=await r.json(); SY.sha=j.sha; remote=norm(JSON.parse(b64d(j.content))); }
      else if (r.status===404){ SY.sha=null; const now=Date.now(); allPaths().forEach(p=>{ if(S._mt[p]==null || S._mt[p]===0) S._mt[p]=now; }); }
      else if (r.status===401||r.status===403){ setSync('auth'); return; }
      else throw new Error('GET '+r.status);
      if (remote && mergeIn(remote)){ save(false); const f=document.activeElement; if(!(f && f.tagName==='INPUT')) route(); }
      if (remote && !needsPush(remote)){ setSync('ok'); return; }
      const w = await gh('PUT', { message:'Sync '+new Date().toISOString(), content:b64e(JSON.stringify(S)), ...(SY.sha?{sha:SY.sha}:{}) });
      if (w.status===200||w.status===201){ SY.sha=(await w.json()).content.sha; setSync('ok'); return; }
      if (w.status===409||w.status===422) continue;          // the other phone saved first: pull, merge, try again
      if (w.status===401||w.status===403){ setSync('auth'); return; }
      throw new Error('PUT '+w.status);
    }
    setSync('ok');
  } catch(e){ setSync('offline'); }
  finally { SY.busy=false; if(SY.again){ SY.again=false; setTimeout(syncNow,300); } }
}
function syncText(){
  return { off:'', syncing:'Syncing…', offline:'Offline — will retry', auth:"Token didn't work — check it has Contents read & write on that repo",
    ok:'Synced ✓ '+(SY.last?SY.last.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'') }[SY.state];
}
function setSync(st){
  SY.state=st; if(st==='ok') SY.last=new Date();
  const b=$('syncbadge'); b.hidden=!SY.cfg; b.dataset.s=st; b.textContent={ok:'Synced',syncing:'Syncing',offline:'Offline',auth:'Sync error',off:''}[st];
  const el=$('syncstatus'); if(el) el.textContent=syncText();
}
setInterval(()=>{ if(SY.cfg && !document.hidden) syncNow(); }, 15000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && SY.cfg){ syncNow(); loadPrivate(); } });
addEventListener('online', ()=>{ if(SY.cfg) syncNow(); });

if (S.plan.length!==5 || S.plan.some(id=>!byId(id))) { S.locked=[]; S.cooked=[]; generate(true); } else route();
if (SY.cfg){ syncNow(); loadPrivate(); }
</script>
